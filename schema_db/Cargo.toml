[package]
name = "schema_db"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }
bincode = "1.3"
lru = "0.12"

[dev-dependencies]
tempfile = "3"
